publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  google_mlkit_text_recognition: ^0.13.0
  http: ^1.2.0
